name: docker-ghcr

# 多架构镜像（amd64/arm64）构建并发布到 ghcr.io/<本仓库>。
# 本仓库约定：docker 构建只在 develop 分支进行，且仅由「推送 v* tag」触发。
# 与上游的差异：上游在 push 到 main / 打 tag 时构建；此处已迁移到 develop + tag。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 仅当 tag 指向 develop 分支上的提交时才构建（main 上的 tag 会被拦下）
      - name: 校验 tag 位于 develop 分支
        run: |
          git fetch origin develop
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/develop; then
            echo "::error::tag ${GITHUB_REF_NAME} 不在 develop 分支上，跳过构建"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} 位于 develop，继续构建"

      - name: Resolve app version
        id: app-version
        run: echo "value=${GITHUB_REF_NAME#v}-panel" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU（arm64 交叉模拟）
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.app-version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 关闭 provenance attestation：避免 ghcr 页面出现 unknown/unknown 架构条目
          provenance: false
